spring.application.name=spring-ai-chat

# Where Ollama is running (this is its default address)
spring.ai.ollama.base-url=http://localhost:11434
# The model we pulled with: ollama pull qwen3.5:4b
spring.ai.ollama.chat.model=qwen3.5:4b
# 0 = always the same answer, 1 = more creative
spring.ai.ollama.chat.temperature=0.7
# How much text the model can keep in mind at once (8K keeps memory small on a laptop)
spring.ai.ollama.chat.num-ctx=8192
# The sneaky setting: qwen3.5 "thinks" before answering. That is very slow on a laptop, so turn it off.
spring.ai.ollama.chat.think=false

# Chat memory in a small file database (H2): the file chai-memory.mv.db, next to pom.xml
spring.datasource.url=jdbc:h2:file:./chai-memory
# Create the memory table when the app starts (only if it isn't there yet)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
